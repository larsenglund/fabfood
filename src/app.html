<title>Middagsbanken</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap">
<style>
  :root {
    --ground:#F2F4EF; --surface:#FFFFFF; --sunken:#E7EBE2;
    --ink:#16211B; --muted:#5E6E64; --faint:#8A968E;
    --line:#D7DDD2; --line-soft:#E4E9DE;
    --accent:#1D5B43; --accent-ink:#FFFFFF; --accent-soft:#DDEBE2; --accent-line:#B9D4C5;
    --amber:#B5790F; --amber-soft:#F6E9CC;
    --danger:#A33726;
    --shadow:0 1px 2px rgba(22,33,27,.06), 0 6px 18px -12px rgba(22,33,27,.22);
    --r:10px;
    --font-display:"Fraunces","Iowan Old Style",Georgia,serif;
    --font-body:"Karla","Helvetica Neue",Arial,sans-serif;
    --font-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  :root:not([data-theme="light"]) { color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#0F1412; --surface:#18201C; --sunken:#131A16;
      --ink:#E7ECE6; --muted:#9AA89E; --faint:#7A877E;
      --line:#29342D; --line-soft:#212B25;
      --accent:#6BC49D; --accent-ink:#0F1412; --accent-soft:#1B2C24; --accent-line:#2C463A;
      --amber:#E0AC5A; --amber-soft:#2E2517;
      --danger:#E08373;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -14px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"] {
    --ground:#0F1412; --surface:#18201C; --sunken:#131A16;
    --ink:#E7ECE6; --muted:#9AA89E; --faint:#7A877E;
    --line:#29342D; --line-soft:#212B25;
    --accent:#6BC49D; --accent-ink:#0F1412; --accent-soft:#1B2C24; --accent-line:#2C463A;
    --amber:#E0AC5A; --amber-soft:#2E2517;
    --danger:#E08373;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px -14px rgba(0,0,0,.7);
  }

  body { background:var(--ground); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.5; }
  * { box-sizing:border-box; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }

  .wrap { max-width:1180px; margin:0 auto; padding-inline:18px; padding-block:22px 64px; }

  /* ---- topbar ---- */
  .topbar { display:flex; flex-wrap:wrap; gap:16px 24px; align-items:flex-end; justify-content:space-between;
            padding-bottom:16px; border-bottom:1px solid var(--line); }
  .brand h1 { font-family:var(--font-display); font-size:32px; font-weight:600; letter-spacing:-.01em; margin:0; line-height:1.1; }
  .brand p { margin:4px 0 0; color:var(--muted); font-size:13.5px; }
  .brand .count { font-family:var(--font-mono); font-size:12.5px; }

  .weeknav { display:flex; align-items:center; gap:8px; }
  .weeknav .label { text-align:center; min-width:126px; }
  .weeknav .wk { font-family:var(--font-mono); font-size:17px; font-weight:500; display:block; letter-spacing:-.02em; }
  .weeknav .span { font-size:12px; color:var(--muted); display:block; font-variant-numeric:tabular-nums; }

  /* ---- buttons ---- */
  button { font:inherit; color:inherit; cursor:pointer; background:none; border:none; }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border:1px solid var(--line);
         background:var(--surface); border-radius:var(--r); font-size:13.5px; font-weight:500;
         transition:border-color .12s, background .12s; white-space:nowrap; }
  .btn:hover { border-color:var(--accent-line); }
  .btn-primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
  .btn-primary:hover { filter:brightness(1.08); border-color:var(--accent); }
  .btn-quiet { border-color:transparent; background:transparent; color:var(--muted); padding:5px 8px; }
  .btn-quiet:hover { color:var(--ink); background:var(--sunken); }
  .btn-icon { width:30px; height:30px; padding:0; justify-content:center; border-radius:8px; }
  .btn-danger { color:var(--danger); border-color:var(--line); }
  .btn[disabled] { opacity:.45; cursor:not-allowed; }

  /* ---- layout ---- */
  .layout { display:grid; grid-template-columns:minmax(300px,400px) 1fr; gap:30px; align-items:start; margin-top:24px; }
  @media (max-width:940px) { .layout { grid-template-columns:1fr; gap:34px; } }

  .sec-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .sec-head h2 { font-family:var(--font-display); font-size:19px; font-weight:600; margin:0; }
  .sec-head .hint { font-size:12.5px; color:var(--faint); }

  /* ---- week ---- */
  .week-tools { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .days { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .day { display:grid; grid-template-columns:74px 1fr; gap:12px; align-items:center;
         background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--r); padding:10px 12px;
         transition:border-color .12s, background .12s; }
  .day.is-empty { background:var(--sunken); border-style:dashed; border-color:var(--line); }
  .day.is-today { border-left:3px solid var(--amber); padding-left:9px; }
  .day.is-armed { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
  .day-name { font-family:var(--font-display); font-size:14.5px; font-weight:600; line-height:1.25; }
  .day-date { font-family:var(--font-mono); font-size:11px; color:var(--faint); display:block; }
  .day.is-today .day-date { color:var(--amber); }
  .slot { min-width:0; display:flex; align-items:center; gap:8px; justify-content:space-between; }
  .slot-main { min-width:0; }
  .slot-name { font-weight:600; font-size:14.5px; overflow-wrap:anywhere; }
  .slot-meta { display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:11.5px; color:var(--muted); margin-top:2px; }
  .slot-acts { display:flex; gap:2px; flex:0 0 auto; }
  .slot-empty { width:100%; text-align:left; color:var(--muted); font-size:13.5px; padding:3px 0; }
  .slot-empty:hover { color:var(--accent); }
  .slot-gone { color:var(--danger); font-size:13px; font-style:italic; }

  /* ---- library ---- */
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center; }
  .search { flex:1 1 190px; min-width:0; display:flex; align-items:center; gap:7px; background:var(--surface);
            border:1px solid var(--line); border-radius:var(--r); padding:0 10px; }
  .search input { flex:1; min-width:0; border:none; background:none; font:inherit; color:inherit; padding:8px 0; }
  .search input:focus { outline:none; }
  .search:focus-within { border-color:var(--accent); }
  select.sel { font:inherit; font-size:13.5px; color:inherit; background:var(--surface); border:1px solid var(--line);
               border-radius:var(--r); padding:7px 8px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .chip { font-size:12.5px; padding:4px 11px; border-radius:999px; border:1px solid var(--line);
          background:var(--surface); color:var(--muted); }
  .chip:hover { border-color:var(--accent-line); color:var(--ink); }
  .chip[aria-pressed="true"] { background:var(--accent-soft); border-color:var(--accent-line); color:var(--ink); font-weight:600; }

  .arm-bar { display:none; align-items:center; gap:10px; flex-wrap:wrap; background:var(--accent-soft);
             border:1px solid var(--accent-line); border-radius:var(--r); padding:8px 12px; margin-bottom:12px; font-size:13.5px; }
  .arm-bar.on { display:flex; }
  .arm-bar strong { font-weight:600; }

  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:10px; align-items:start; }
  .card { background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--r); padding:11px 12px;
          display:flex; flex-direction:column; gap:7px; transition:border-color .12s, transform .12s; }
  .card:hover { border-color:var(--accent-line); }
  .picking .card { cursor:pointer; }
  .picking .card:hover { border-color:var(--accent); transform:translateY(-1px); }
  .card.is-planned { border-color:var(--accent-line); background:linear-gradient(var(--accent-soft),var(--accent-soft)) no-repeat left/3px 100%, var(--surface); }
  .card h3 { margin:0; font-family:var(--font-display); font-size:15px; font-weight:600; line-height:1.25; overflow-wrap:anywhere; }
  .card .note { font-size:12.5px; color:var(--muted); margin:0; }
  .card-meta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding-top:2px; }
  .card-foot { display:flex; gap:8px; align-items:center; justify-content:flex-end; border-top:1px solid var(--line-soft); padding-top:8px; }
  .card-foot .recipe { margin-right:auto; }

  .tag { font-size:11px; padding:2px 7px; border-radius:999px; background:var(--sunken); color:var(--muted); white-space:nowrap; }
  .tag-veg { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .tag-time { font-family:var(--font-mono); font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .tag-planned { background:var(--amber-soft); color:var(--amber); font-weight:600; }
  a.recipe { color:var(--accent); font-size:12.5px; text-decoration:none; border-bottom:1px solid var(--accent-line); }
  a.recipe:hover { border-bottom-color:var(--accent); }

  .empty-state { grid-column:1/-1; padding:30px 4px; color:var(--muted); font-size:14px; text-align:center; }
  .skeleton { height:88px; border-radius:var(--r); background:var(--sunken); border:1px solid var(--line-soft); }
  .notice { background:var(--amber-soft); border:1px solid var(--amber); border-radius:var(--r); padding:11px 14px;
            font-size:13.5px; margin-bottom:16px; }

  /* ---- dialogs ---- */
  dialog { border:1px solid var(--line); border-radius:14px; background:var(--surface); color:var(--ink);
           padding:0; max-width:min(460px,calc(100vw - 32px)); width:100%; box-shadow:var(--shadow); }
  dialog::backdrop { background:rgba(12,20,16,.45); }
  .dlg-head { padding:16px 18px 0; }
  .dlg-head h3 { font-family:var(--font-display); font-size:18px; font-weight:600; margin:0; }
  .dlg-head p { margin:4px 0 0; font-size:13px; color:var(--muted); }
  .dlg-body { padding:14px 18px; display:flex; flex-direction:column; gap:12px; }
  .dlg-foot { padding:12px 18px 16px; display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
  .dlg-foot .spacer { margin-right:auto; }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field label { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; }
  .field input[type=text], .field input[type=url], .field input[type=number], .field textarea {
    font:inherit; color:inherit; background:var(--ground); border:1px solid var(--line); border-radius:8px; padding:8px 10px; width:100%; }
  .field textarea { resize:vertical; min-height:62px; }
  .field input:focus, .field textarea:focus { outline:none; border-color:var(--accent); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .check { display:flex; align-items:center; gap:8px; font-size:14px; }
  .daypick { display:flex; flex-direction:column; gap:5px; }
  .daypick button { display:flex; justify-content:space-between; gap:10px; align-items:center; text-align:left;
                    border:1px solid var(--line-soft); background:var(--ground); border-radius:8px; padding:9px 11px; font-size:14px; }
  .daypick button:hover { border-color:var(--accent); }
  .daypick .taken { font-size:12px; color:var(--muted); text-align:right; overflow-wrap:anywhere; }
  .err { color:var(--danger); font-size:12.5px; }

  #toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(12px); opacity:0;
           background:var(--ink); color:var(--ground); padding:9px 16px; border-radius:999px; font-size:13.5px;
           pointer-events:none; transition:opacity .18s, transform .18s; z-index:60; max-width:92vw; text-align:center; }
  #toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
  .mode-note { display:block; margin-top:2px; font-size:12px; color:var(--faint); }

  .notice.delad { display:flex; flex-direction:column; gap:10px; background:var(--accent-soft);
                  border-color:var(--accent-line); margin-bottom:20px; }
  .delad-head { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .delad-head strong { font-family:var(--font-display); font-size:16px; font-weight:600; }
  .delad-span { font-family:var(--font-mono); font-size:12px; color:var(--muted); }
  .delad-lista { list-style:none; margin:0; padding:0; display:grid;
                 grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:2px 18px; font-size:13.5px; }
  .delad-lista li { display:flex; gap:8px; }
  .delad-dag { font-weight:600; min-width:62px; flex:0 0 auto; }
  .delad-knappar { display:flex; gap:8px; flex-wrap:wrap; }

  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>

<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <h1>Middagsbanken</h1>
      <p><span class="count" id="stat">Hämtar middagsförslag …</span><span class="mode-note" id="mode-note">&nbsp;</span></p>
    </div>
    <nav class="weeknav" aria-label="Veckoval">
      <button class="btn btn-icon" id="prev-week" title="Föregående vecka" aria-label="Föregående vecka">←</button>
      <span class="label"><span class="wk" id="wk-num">v.&nbsp;–</span><span class="span" id="wk-span">&nbsp;</span></span>
      <button class="btn btn-icon" id="next-week" title="Nästa vecka" aria-label="Nästa vecka">→</button>
      <button class="btn" id="this-week">Idag</button>
    </nav>
  </header>

  <div id="notice-slot"></div>

  <main class="layout">
    <section class="week" aria-labelledby="week-h">
      <div class="sec-head">
        <h2 id="week-h">Veckomatsedel</h2>
        <span class="hint" id="week-hint"></span>
      </div>
      <div class="week-tools">
        <button class="btn" id="fill-rest">Slumpa resten</button>
        <button class="btn" id="copy-last">Förra veckan</button>
        <button class="btn" id="share-week">Kopiera text</button>
        <button class="btn" id="share-link">Dela länk</button>
        <button class="btn" id="clear-week">Rensa</button>
      </div>
      <ol class="days" id="days"></ol>
    </section>

    <section class="library" aria-labelledby="lib-h">
      <div class="sec-head">
        <h2 id="lib-h">Middagsförslag</h2>
        <button class="btn btn-primary" id="new-meal">Nytt förslag</button>
      </div>
      <div class="toolbar">
        <div class="search">
          <span aria-hidden="true" style="color:var(--faint)">⌕</span>
          <input type="search" id="q" placeholder="Sök middag, ingrediens eller anteckning" aria-label="Sök bland middagsförslagen">
        </div>
        <select class="sel" id="sort" aria-label="Sortering">
          <option value="namn">Namn A–Ö</option>
          <option value="tid">Kortast tid</option>
          <option value="ny">Senast tillagda</option>
        </select>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filter"></div>
      <div class="arm-bar" id="arm-bar">
        <span>Välj middag till <strong id="arm-day"></strong></span>
        <button class="btn btn-quiet" id="arm-cancel">Avbryt</button>
      </div>
      <div class="cards" id="cards"></div>
    </section>
  </main>
</div>

<dialog id="meal-dialog">
  <form method="dialog" id="meal-form">
    <div class="dlg-head"><h3 id="meal-dlg-title">Nytt middagsförslag</h3></div>
    <div class="dlg-body">
      <div class="field">
        <label for="f-namn">Namn</label>
        <input type="text" id="f-namn" required maxlength="120" placeholder="T.ex. Ugnsbakad torsk med dill">
        <span class="err" id="f-err" hidden>Middagen behöver ett namn.</span>
      </div>
      <div class="row2">
        <div class="field">
          <label for="f-tid">Tid (min)</label>
          <input type="number" id="f-tid" min="5" max="600" step="5" placeholder="40">
        </div>
        <div class="field">
          <label for="f-veg">Vegetariskt</label>
          <span class="check"><input type="checkbox" id="f-veg"><label for="f-veg" style="text-transform:none;letter-spacing:0;font-weight:400;font-size:14px;color:var(--ink)">Ja, veg</label></span>
        </div>
      </div>
      <div class="field">
        <label for="f-lank">Receptlänk</label>
        <input type="url" id="f-lank" placeholder="https://…">
      </div>
      <div class="field">
        <label for="f-ant">Anteckning</label>
        <textarea id="f-ant" maxlength="400" placeholder="Tillbehör, tips, vem som gillar den …"></textarea>
      </div>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn btn-danger spacer" id="f-delete" hidden>Ta bort</button>
      <button type="button" class="btn" id="f-cancel">Avbryt</button>
      <button type="submit" class="btn btn-primary" id="f-save">Spara</button>
    </div>
  </form>
</dialog>

<dialog id="day-dialog">
  <div class="dlg-head"><h3 id="day-dlg-title">Lägg på dag</h3><p id="day-dlg-sub"></p></div>
  <div class="dlg-body"><div class="daypick" id="daypick"></div></div>
  <div class="dlg-foot"><button class="btn" id="day-cancel">Avbryt</button></div>
</dialog>

<dialog id="text-dialog">
  <div class="dlg-head"><h3>Kopiera</h3><p>Markera texten och kopiera den.</p></div>
  <div class="dlg-body"><div class="field"><textarea id="text-out" rows="10" readonly></textarea></div></div>
  <div class="dlg-foot"><button class="btn" id="text-close">Stäng</button></div>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var DAGAR = ["Måndag","Tisdag","Onsdag","Torsdag","Fredag","Lördag","Söndag"];
  var state = {
    store: null, delad: false, meals: null, plan: {}, weekStart: mondayOf(new Date()),
    armed: null, q: "", filter: "alla", sort: "namn", tags: []
  };
  var unsubPlan = null, delning = null;

  /* ---------- små hjälpare ---------- */
  function $(id) { return document.getElementById(id); }
  function el(tag, attrs) {
    var n = document.createElement(tag), k;
    attrs = attrs || {};
    for (k in attrs) {
      var v = attrs[k];
      if (v === null || v === false || v === undefined) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (var i = 2; i < arguments.length; i++) {
      var kid = arguments[i];
      if (kid == null) continue;
      if (Array.isArray(kid)) kid.forEach(function (c) { if (c != null) n.append(c); });
      else n.append(kid);
    }
    return n;
  }
  var toastTimer;
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg; t.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("on"); }, 2600);
  }
  function safeUrl(u) { return typeof u === "string" && /^https?:\/\//i.test(u.trim()) ? u.trim() : ""; }
  function fold(s) { return (s || "").toString().toLowerCase(); }
  function nyttId() { return "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function normalisera(id, v) {
    return {
      id: id, namn: v.namn || "(namnlös)", tid: typeof v.tid === "number" ? v.tid : null,
      veg: !!v.veg, lank: v.lank || "", anteckning: v.anteckning || "",
      kalla: v.kalla || "", taggar: Array.isArray(v.taggar) ? v.taggar : [],
      skapad: v.skapad || "", nr: v.nr || null
    };
  }
  function kropp(m) {
    return { namn: m.namn, tid: m.tid, veg: m.veg, lank: m.lank, anteckning: m.anteckning,
             kalla: m.kalla, taggar: m.taggar, nr: m.nr, skapad: m.skapad };
  }

  /* ---------- veckologik ---------- */
  function mondayOf(d) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
  function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function isoWeek(d) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    t.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7) + 3);
    var ft = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
    ft.setUTCDate(ft.getUTCDate() - ((ft.getUTCDay() + 6) % 7) + 3);
    return { ar: t.getUTCFullYear(), vecka: 1 + Math.round((t - ft) / 604800000) };
  }
  function keyOf(monday) { var w = isoWeek(monday); return w.ar + "-v" + String(w.vecka).padStart(2, "0"); }
  function mondayFromKey(key) {
    var m = /^(\d{4})-v(\d{1,2})$/.exec(key || "");
    if (!m) return null;
    var jan4 = new Date(Number(m[1]), 0, 4);
    return addDays(mondayOf(jan4), (Number(m[2]) - 1) * 7);
  }
  var fmtDay = new Intl.DateTimeFormat("sv-SE", { day: "numeric", month: "short" });

  /* ---------- lagring: artifact-databas (delad) ---------- */
  function dbStore(db) {
    return {
      delad: true,
      onMeals: function (cb, err) {
        return db.collection("meals").onSnapshot(function (s) {
          cb(s.docs.map(function (d) { return normalisera(d.id, d.data() || {}); }));
        }, err);
      },
      onPlan: function (key, cb, err) {
        return db.doc("plans/" + key).onSnapshot(function (s) {
          var v = s.exists ? s.data() : null;
          cb(v && v.dagar && typeof v.dagar === "object" ? Object.assign({}, v.dagar) : {});
        }, err);
      },
      getPlan: function (key) {
        return db.doc("plans/" + key).get().then(function (s) {
          var v = s.exists ? s.data() : null;
          return v && v.dagar && typeof v.dagar === "object" ? Object.assign({}, v.dagar) : {};
        });
      },
      savePlan: function (key, dagar) {
        return db.doc("plans/" + key).set({ vecka: key, dagar: dagar, uppdaterad: new Date().toISOString() });
      },
      addMeal: function (body) { return db.collection("meals").add(body).then(function (ref) { return ref.id; }); },
      setMeal: function (id, body) { return db.doc("meals/" + id).set(body); },
      delMeal: function (id) { return db.doc("meals/" + id).delete(); }
    };
  }

  /* ---------- lagring: den egna webbläsaren ---------- */
  function localStore(seed) {
    var MK = "middagsbanken.middagar", PK = "middagsbanken.veckor";
    var mealCb = null, planCb = null, planKey = null;

    function las(k, fb) { try { var v = window.localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } }
    function skriv(k, v) { try { window.localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* privat läge eller fullt */ } }

    var meals = las(MK, null);
    if (!Array.isArray(meals) || !meals.length) { meals = seed.slice(); skriv(MK, meals); }
    var plans = las(PK, {}) || {};

    function sparaMeals() { skriv(MK, meals); if (mealCb) mealCb(meals.map(function (m) { return normalisera(m.id, m); })); }
    function sparaPlans() { skriv(PK, plans); if (planCb && planKey) planCb(Object.assign({}, plans[planKey] || {})); }

    return {
      delad: false,
      onMeals: function (cb) {
        mealCb = cb;
        setTimeout(function () { cb(meals.map(function (m) { return normalisera(m.id, m); })); }, 0);
        return function () { mealCb = null; };
      },
      onPlan: function (key, cb) {
        planCb = cb; planKey = key;
        setTimeout(function () { cb(Object.assign({}, plans[key] || {})); }, 0);
        return function () { planCb = null; planKey = null; };
      },
      getPlan: function (key) { return Promise.resolve(Object.assign({}, plans[key] || {})); },
      savePlan: function (key, dagar) {
        if (Object.keys(dagar).length) plans[key] = dagar; else delete plans[key];
        sparaPlans(); return Promise.resolve();
      },
      addMeal: function (body) {
        var id = nyttId();
        meals.push(Object.assign({ id: id }, body));
        sparaMeals(); return Promise.resolve(id);
      },
      setMeal: function (id, body) {
        for (var i = 0; i < meals.length; i++) if (meals[i].id === id) meals[i] = Object.assign({ id: id }, body);
        sparaMeals(); return Promise.resolve();
      },
      delMeal: function (id) {
        meals = meals.filter(function (m) { return m.id !== id; });
        sparaMeals(); return Promise.resolve();
      }
    };
  }

  /* ---------- plan ---------- */
  function mealById(id) {
    if (!id || !state.meals) return null;
    for (var i = 0; i < state.meals.length; i++) if (state.meals[i].id === id) return state.meals[i];
    return null;
  }
  function mealByName(namn) {
    var n = fold(namn).trim();
    if (!n || !state.meals) return null;
    for (var i = 0; i < state.meals.length; i++) if (fold(state.meals[i].namn).trim() === n) return state.meals[i];
    return null;
  }
  function savePlan(dagar) {
    if (!state.store) { toast("Middagslistan är inte laddad än."); return Promise.resolve(); }
    state.plan = dagar;
    renderWeek(); renderCards();
    return state.store.savePlan(keyOf(state.weekStart), dagar)
      .catch(function () { toast("Kunde inte spara veckan – försök igen."); });
  }
  function setDay(i, mealId) {
    var d = Object.assign({}, state.plan);
    if (mealId) d[String(i)] = mealId; else delete d[String(i)];

  function watchPlan() {
    if (unsubPlan) { unsubPlan(); unsubPlan = null; }

    unsubPlan = state.store.onPlan(keyOf(state.weekStart), function (dagar) {

  }

  /* ---------- rendering: bibliotek ---------- */
  var FILTER = [

  function visible() {
    var q = fold(state.q).trim();
    var list = (state.meals || []).filter(function (m) {
      if (state.filter === "veg" && !m.veg) return false;
      if (state.filter === "snabb" && !(m.tid && m.tid < 45)) return false;
      if (state.filter === "recept" && !safeUrl(m.lank)) return false;
      if (state.filter.slice(0, 4) === "tag:" && (m.taggar || []).indexOf(state.filter.slice(4)) === -1) return false;
      if (q && fold(m.namn + " " + (m.anteckning || "") + " " + (m.taggar || []).join(" ")).indexOf(q) === -1) return false;
      return true;
    });
    list.sort(function (a, b) {
      if (state.sort === "tid") {
        var ta = a.tid || 9999, tb = b.tid || 9999;
        if (ta !== tb) return ta - tb;
      } else if (state.sort === "ny") {
        var sa = a.skapad || "", sb = b.skapad || "";

      return a.namn.localeCompare(b.namn, "sv");
    });
    return list;
  }

  function plannedDays(id) {

  }

  /* ---------- text och delning ---------- */
  function veckansNamn() {

    }

  }
  function b64e(s) {
    var bytes = new TextEncoder().encode(s), bin = "";
    bytes.forEach(function (b) { bin += String.fromCharCode(b); });
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function b64d(s) {
    var bin = atob(s.replace(/-/g, "+").replace(/_/g, "/"));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

    } catch (e) { return null; }
  }

  function visaDelning() {

    var w = isoWeek(monday);

      lista,
      el("div", { class: "delad-knappar" },
        el("button", { class: "btn btn-primary", type: "button", onclick: function () { importera(monday); } }, "Lägg in i min matsedel"),
        el("button", { class: "btn", type: "button", onclick: stangDelning }, "Nej tack"))
    );
    $("notice-slot").textContent = "";
    $("notice-slot").append(box);
    gotoWeek(monday);
  }

  function stangDelning() {
    delning = null;
    $("notice-slot").textContent = "";
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { location.hash = ""; }
  }

  function importera(monday) {
    if (!state.store) return;
    var namn = delning.d.slice();
    state.weekStart = monday;
    var dagar = {}, kedja = Promise.resolve(), nya = 0;

    namn.forEach(function (n, i) {
      if (!n) return;
      kedja = kedja.then(function () {
        var m = mealByName(n);
        if (m) { dagar[String(i)] = m.id; return; }
        nya++;
        return state.store.addMeal({
          namn: n, tid: null, veg: false, lank: "", anteckning: "",
          kalla: "Från delad matsedel", taggar: ["Eget tillägg"], nr: null, skapad: new Date().toISOString()
        }).then(function (id) { dagar[String(i)] = id; });
      });
    });

    kedja.then(function () {
      return savePlan(dagar);
    }).then(function () {
      stangDelning();
      watchPlan();
      toast(nya ? "Matsedeln inlagd. " + nya + (nya === 1 ? " ny middag" : " nya middagar") + " tillagda i listan." : "Matsedeln är inlagd.");
    }).catch(function () { toast("Kunde inte lägga in matsedeln."); });
  }

  /* ---------- sök och tangenter ---------- */
  $("q").addEventListener("input", function (e) { state.q = e.target.value; renderCards(); });
  $("sort").addEventListener("change", function (e) { state.sort = e.target.value; renderCards(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && state.armed !== null) armDay(null); });

  /* ---------- start ---------- */
  renderChips();
  renderWeek();
  renderCards();
  delning = lasDelning();

  function anvand(store) {
    state.store = store;
    state.delad = store.delad;
    $("mode-note").textContent = store.delad
      ? "Delad lista – alla som öppnar sidan ser samma matsedel"
      : "Sparas i den här webbläsaren";
    store.onMeals(function (meals) {
      state.meals = meals;
      var tags = [];
      meals.forEach(function (m) { m.taggar.forEach(function (t) { if (t !== "Matplanering" && tags.indexOf(t) === -1) tags.push(t); }); });
      state.tags = tags.sort(function (a, b) { return a.localeCompare(b, "sv"); });
      renderStats(); renderChips(); renderCards(); renderWeek();
      if (delning) visaDelning();
    }, function () { toast("Tappade kontakten med middagslistan. Ladda om sidan."); });
    watchPlan();
  }

  function ingenData(msg) {
    state.meals = [];
    $("notice-slot").append(el("div", { class: "notice", text: msg }));
    $("stat").textContent = "Middagslistan kunde inte laddas";
    renderCards(); renderWeek();
  }

  var boot = (window.claude && window.claude.use) ? window.claude.use("db") : Promise.resolve(null);
  boot.then(function (db) {
    if (db) { anvand(dbStore(db)); return null; }
    return fetch("data/middagar.json", { cache: "no-cache" })
      .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
      .then(function (seed) { anvand(localStore(seed)); });
  }).catch(function () {
    ingenData("Middagslistan kunde inte laddas. Kontrollera att data/middagar.json ligger bredvid sidan och ladda om.");
  });
})();
</script>
