<title>Middagsbanken</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M16 32l2-11 11 6z' fill='%236FC0F0'/%3E%3Cpath d='M48 32l-2-11-11 6z' fill='%236FC0F0'/%3E%3Cellipse cx='32' cy='40' rx='19' ry='16' fill='%23A9DBF6'/%3E%3Cellipse cx='25' cy='38' rx='2.5' ry='3' fill='%234A3340'/%3E%3Cellipse cx='39' cy='38' rx='2.5' ry='3' fill='%234A3340'/%3E%3Cpath d='M28 46q2 3 4 0 2 3 4 0' fill='none' stroke='%234A3340' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<style>
  :root {
    --ground:#F2F9FE; --surface:#FFFFFF; --sunken:#E7F3FD;
    --ink:#26384A; --muted:#6B8299; --faint:#9CB3C8;
    --line:#CFE6F8; --line-soft:#E6F2FC;
    --accent:#6FC0F0; --accent-ink:#0E3A54; --accent-deep:#1C7CB8; --accent-soft:#DCEFFC;
    --mint:#2E8C5B; --mint-soft:#DDF2E4;
    --butter:#B5800F; --butter-soft:#FFF1CE;
    --korall:#C2643C; --korall-soft:#FDE7DB;
    --danger:#CE4A63;
    --skugga:0 2px 0 rgba(111,192,240,.22), 0 10px 22px -14px rgba(30,70,100,.35);
    --skugga-lyft:0 3px 0 rgba(111,192,240,.32), 0 14px 26px -14px rgba(30,70,100,.42);
    --r:18px; --r-liten:12px;
    --font-display:"Baloo 2","Trebuchet MS",sans-serif;
    --font-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",-apple-system,sans-serif;
  }
  /* Sidan är ljus för alla — systemets mörka läge slår inte igenom.
     Paletten nedan ligger kvar bakom data-theme="dark" så att en
     knapp för mörkt läge bara är några rader bort om den behövs. */
  :root { color-scheme: light; }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground:#111C26; --surface:#1B2A38; --sunken:#16232F;
    --ink:#E8F2FA; --muted:#9FB8CD; --faint:#7590A8;
    --line:#2C4356; --line-soft:#243747;
    --accent:#7FC9F5; --accent-ink:#0B2231; --accent-deep:#A9DCFA; --accent-soft:#1E3A50;
    --mint:#74D3A0; --mint-soft:#1B3527;
    --butter:#F2CE72; --butter-soft:#3A3117;
    --korall:#F0A176; --korall-soft:#3A2519;
    --danger:#FF8C9F;
    --skugga:0 2px 0 rgba(0,0,0,.35), 0 10px 22px -14px rgba(0,0,0,.8);
    --skugga-lyft:0 3px 0 rgba(0,0,0,.45), 0 14px 26px -14px rgba(0,0,0,.9);
  }

  body {
    background:var(--ground); color:var(--ink);
    font-family:var(--font-body); font-size:15px; line-height:1.55;
    background-image:
      radial-gradient(circle at 12% 8%, var(--accent-soft) 0 22px, transparent 23px),
      radial-gradient(circle at 88% 4%, var(--korall-soft) 0 16px, transparent 17px),
      radial-gradient(circle at 96% 42%, var(--mint-soft) 0 20px, transparent 21px),
      radial-gradient(circle at 4% 62%, var(--butter-soft) 0 18px, transparent 19px);
    background-attachment:fixed;
  }
  * { box-sizing:border-box; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; border-radius:8px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }

  .wrap { max-width:1180px; margin:0 auto; padding-inline:18px; padding-block:22px 72px; }

  /* ---- topp ---- */
  .topbar { display:flex; flex-wrap:wrap; gap:16px 22px; align-items:center; justify-content:space-between;
            background:var(--surface); border:2px solid var(--line); border-radius:26px;
            padding:14px 20px; box-shadow:var(--skugga); }
  .brand { display:flex; align-items:center; gap:13px; min-width:0; }
  .brand h1 { font-family:var(--font-display); font-size:30px; font-weight:800; margin:0; line-height:1.05;
              letter-spacing:-.01em; color:var(--accent-deep); }
  .brand p { margin:2px 0 0; color:var(--muted); font-size:13px; }
  .brand .count { font-variant-numeric:tabular-nums; }
  .mode-note { display:block; margin-top:2px; font-size:12px; color:var(--faint); }
  .maskot { flex:0 0 auto; width:54px; height:54px; }

  .weeknav { display:flex; align-items:center; gap:7px; }
  .weeknav .label { text-align:center; min-width:120px; }
  .weeknav .wk { font-family:var(--font-display); font-size:20px; font-weight:700; display:block; line-height:1.1; color:var(--accent-deep); }
  .weeknav .span { font-size:12px; color:var(--muted); display:block; font-variant-numeric:tabular-nums; }

  /* ---- knappar ---- */
  button { font:inherit; color:inherit; cursor:pointer; background:none; border:none; }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 15px;
         border:2px solid var(--line); background:var(--surface); color:var(--ink);
         border-radius:999px; font-size:13.5px; font-weight:700; white-space:nowrap;
         box-shadow:0 2px 0 var(--line); transition:transform .12s, box-shadow .12s, background .12s, border-color .12s; }
  .btn:hover { border-color:var(--accent); box-shadow:0 2px 0 var(--accent); transform:translateY(-1px); }
  .btn:active { transform:translateY(1px); box-shadow:0 0 0 var(--accent); }
  .btn-primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); box-shadow:0 3px 0 var(--accent-deep); }
  .btn-primary:hover { background:var(--accent-deep); border-color:var(--accent-deep); color:#fff; box-shadow:0 3px 0 var(--accent-deep); }
  .btn-quiet { border-color:transparent; background:transparent; color:var(--muted); box-shadow:none; padding:6px 10px; font-weight:600; }
  .btn-quiet:hover { color:var(--accent-deep); background:var(--accent-soft); box-shadow:none; transform:none; }
  .btn-icon { width:36px; height:36px; padding:0; justify-content:center; font-size:15px; }
  .btn-danger { color:var(--danger); }
  .btn[disabled] { opacity:.4; cursor:not-allowed; transform:none; }

  /* ---- layout ---- */
  .layout { display:grid; grid-template-columns:minmax(300px,404px) 1fr; gap:26px; align-items:start; margin-top:22px; }
  @media (max-width:940px) { .layout { grid-template-columns:minmax(0,1fr); gap:30px; } }

  .panel { background:var(--surface); border:2px solid var(--line); border-radius:24px;
           padding:18px 18px 20px; box-shadow:var(--skugga); position:relative; min-width:0; }
  /* kattöron på veckopanelen */
  .panel.oron::before, .panel.oron::after {
    content:""; position:absolute; top:-16px; width:0; height:0;
    border-left:14px solid transparent; border-right:14px solid transparent;
    border-bottom:20px solid var(--accent);
  }
  .panel.oron::before { left:24px; transform:rotate(-18deg); }
  .panel.oron::after { left:86px; transform:rotate(18deg); }

  .sec-head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .sec-head h2 { font-family:var(--font-display); font-size:21px; font-weight:800; margin:0; color:var(--accent-deep); }
  .sec-head .hint { font-size:12.5px; color:var(--faint); font-weight:600; }

  /* ---- veckan ---- */
  .week-tools { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px; }
  .days { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .day { display:grid; grid-template-columns:66px 1fr; gap:10px; align-items:center;
         background:var(--sunken); border:2px solid transparent; border-radius:var(--r);
         padding:9px 12px; transition:border-color .14s, background .14s, transform .14s; }
  .day.is-empty { background:transparent; border-style:dashed; border-color:var(--line); }
  .day.is-today { background:var(--butter-soft); border-color:var(--butter); }
  .day.is-armed { border-color:var(--accent); background:var(--accent-soft); transform:scale(1.015); }
  .day-name { font-family:var(--font-display); font-size:15px; font-weight:700; line-height:1.2; }
  .day-date { font-size:11px; color:var(--faint); display:block; font-variant-numeric:tabular-nums; }
  .day.is-today .day-date { color:var(--butter); font-weight:700; }
  .slot { min-width:0; display:flex; align-items:center; gap:9px; justify-content:space-between; }
  .slot-vanster { display:flex; align-items:center; gap:9px; min-width:0; }
  .slot-main { min-width:0; }
  .slot-name { font-weight:700; font-size:14.5px; overflow-wrap:anywhere; line-height:1.25; }
  .slot-meta { display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-size:11.5px; color:var(--muted); margin-top:1px; }
  .slot-acts { display:flex; gap:2px; flex:0 0 auto; }
  .slot-empty { width:100%; text-align:left; color:var(--muted); font-size:13.5px; padding:5px 0;
                display:flex; align-items:center; gap:8px; font-weight:600; }
  .slot-empty:hover { color:var(--accent-deep); }
  .slot-empty .tass { width:19px; height:19px; flex:0 0 auto; opacity:.65; }
  .slot-empty:hover .tass { opacity:1; }
  .slot-gone { color:var(--danger); font-size:13px; font-weight:600; }

  /* ---- biblioteket ---- */
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center; }
  .search { flex:1 1 190px; min-width:0; display:flex; align-items:center; gap:8px; background:var(--sunken);
            border:2px solid transparent; border-radius:999px; padding:0 14px; }
  .search input { flex:1 1 0; width:0; min-width:0; border:none; background:none; font:inherit; color:inherit; padding:9px 0; }
  .search input:focus { outline:none; }
  .search:focus-within { border-color:var(--accent); background:var(--surface); }
  .search .lupp { width:17px; height:17px; flex:0 0 auto; }
  select.sel { font:inherit; font-size:13.5px; font-weight:600; color:inherit; background:var(--sunken);
               border:2px solid transparent; border-radius:999px; padding:8px 12px; }
  select.sel:focus { outline:none; border-color:var(--accent); }

  .chips { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:15px; }
  .chip { font-size:12.5px; font-weight:700; padding:5px 13px; border-radius:999px;
          border:2px solid var(--line); background:var(--surface); color:var(--muted); transition:all .12s; }
  .chip:hover { border-color:var(--accent); color:var(--ink); }
  .chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }

  .arm-bar { display:none; align-items:center; gap:10px; flex-wrap:wrap; background:var(--accent-soft);
             border:2px dashed var(--accent); border-radius:var(--r); padding:9px 14px; margin-bottom:13px; font-size:13.5px; font-weight:600; }
  .arm-bar.on { display:flex; }
  .arm-bar strong { font-weight:800; color:var(--accent-deep); }

  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(228px,1fr)); gap:11px; align-items:start; }
  .card { background:var(--surface); border:2px solid var(--line-soft); border-radius:var(--r);
          padding:12px; display:flex; flex-direction:column; gap:8px;
          transition:border-color .14s, transform .14s, box-shadow .14s; }
  .card:hover { border-color:var(--accent); box-shadow:var(--skugga); }
  .picking .card { cursor:pointer; }
  .picking .card:hover { transform:translateY(-3px) rotate(-.6deg); box-shadow:var(--skugga-lyft); }
  .card.is-planned { border-color:var(--butter); background:linear-gradient(var(--butter-soft),var(--butter-soft)) no-repeat top/100% 5px, var(--surface); }
  .card-topp { display:flex; align-items:center; gap:10px; }
  .card h3 { margin:0; font-family:var(--font-display); font-size:15.5px; font-weight:700; line-height:1.22; overflow-wrap:anywhere; }
  .card .note { font-size:12.5px; color:var(--muted); margin:0; line-height:1.4; }
  .card-meta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .card-foot { display:flex; gap:7px; align-items:center; justify-content:flex-end; border-top:2px dotted var(--line); padding-top:9px; }
  .card-foot .recipe { margin-right:auto; }

  .ikon-platta { flex:0 0 auto; width:42px; height:42px; border-radius:14px; background:var(--sunken);
                 display:grid; place-items:center; border:2px solid var(--line-soft); }
  .card:hover .ikon-platta { border-color:var(--accent); }
  .ikon-platta.liten { width:34px; height:34px; border-radius:11px; }
  .mat-ikon { display:block; }

  .tag { font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--sunken); color:var(--muted); white-space:nowrap; }
  .tag-veg { background:var(--mint-soft); color:var(--mint); }
  .tag-time { font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px;
              background:var(--korall-soft); color:var(--korall); font-variant-numeric:tabular-nums; }
  .tag-planned { background:var(--butter-soft); color:var(--butter); }
  .tag-betyg { background:var(--butter-soft); color:var(--butter); font-variant-numeric:tabular-nums; }

  .betyg { display:flex; align-items:center; gap:2px; }
  .betyg .stjarna { padding:1px; line-height:0; color:var(--line); border-radius:7px;
                    transition:transform .12s, color .12s; }
  .betyg .stjarna.pa { color:var(--butter); }
  .betyg .stjarna:hover { transform:scale(1.2); color:var(--butter); }
  .betyg .stj { width:16px; height:16px; display:block; }
  .betyg.stor { gap:4px; }
  .betyg.stor .stjarna { padding:2px; }
  .betyg.stor .stj { width:27px; height:27px; }
  .betyg-txt { font-size:11.5px; font-weight:700; color:var(--butter); margin-left:5px; font-variant-numeric:tabular-nums; }
  a.recipe { color:var(--accent-deep); font-size:12.5px; font-weight:700; text-decoration:none; }
  a.recipe:hover { text-decoration:underline; }

  .empty-state { grid-column:1/-1; padding:34px 4px; color:var(--muted); font-size:14.5px; text-align:center; font-weight:600; }
  .empty-state .stor-katt { display:block; margin:0 auto 10px; width:74px; height:74px; }
  .skeleton { height:96px; border-radius:var(--r); background:var(--sunken); border:2px solid var(--line-soft); }
  .notice { background:var(--butter-soft); border:2px solid var(--butter); border-radius:var(--r);
            padding:13px 16px; font-size:13.5px; font-weight:600; margin-bottom:18px; }

  /* ---- dialoger ---- */
  dialog { border:3px solid var(--accent); border-radius:26px; background:var(--surface); color:var(--ink);
           padding:0; max-width:min(460px,calc(100vw - 32px)); width:100%; box-shadow:var(--skugga-lyft); }
  dialog::backdrop { background:rgba(80,40,60,.42); backdrop-filter:blur(2px); }
  .dlg-head { padding:18px 20px 0; }
  .dlg-head h3 { font-family:var(--font-display); font-size:20px; font-weight:800; margin:0; color:var(--accent-deep); }
  .dlg-head p { margin:3px 0 0; font-size:13px; color:var(--muted); }
  .dlg-body { padding:15px 20px; display:flex; flex-direction:column; gap:13px; }
  .dlg-foot { padding:12px 20px 18px; display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
  .dlg-foot .spacer { margin-right:auto; }
  .field { display:flex; flex-direction:column; gap:5px; }
  .field label { font-size:12px; letter-spacing:.03em; color:var(--muted); font-weight:700; }
  .field input[type=text], .field input[type=url], .field input[type=number], .field textarea {
    font:inherit; color:inherit; background:var(--sunken); border:2px solid transparent;
    border-radius:var(--r-liten); padding:10px 12px; width:100%; }
  .field textarea { resize:vertical; min-height:64px; }
  .field input:focus, .field textarea:focus { outline:none; border-color:var(--accent); background:var(--surface); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:13px; }
  .check { display:flex; align-items:center; gap:8px; font-size:14px; }
  .check input { width:18px; height:18px; accent-color:var(--accent); }
  .daypick { display:flex; flex-direction:column; gap:6px; }
  .daypick button { display:flex; justify-content:space-between; gap:10px; align-items:center; text-align:left;
                    border:2px solid var(--line-soft); background:var(--sunken); border-radius:var(--r-liten);
                    padding:10px 13px; font-size:14px; font-weight:600; transition:all .12s; }
  .daypick button:hover { border-color:var(--accent); background:var(--accent-soft); }
  .daypick .taken { font-size:12px; color:var(--muted); text-align:right; overflow-wrap:anywhere; font-weight:500; }
  .err { color:var(--danger); font-size:12.5px; font-weight:600; }

  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(14px); opacity:0;
           background:var(--accent-deep); color:#fff; padding:11px 20px; border-radius:999px;
           font-size:13.5px; font-weight:700; pointer-events:none; z-index:60; max-width:92vw; text-align:center;
           box-shadow:var(--skugga-lyft); transition:opacity .18s, transform .18s; }
  #toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>

<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <svg class="maskot" viewBox="0 0 64 64" role="img" aria-label="Middagsbankens kock­katt">
        <path d="M20 21c-5 0-8-4-6-8s6-4 8-6 6-3 10-3 8 1 10 3 6 2 8 6-1 8-6 8z" fill="#FFF7FA" stroke="#BADDF5" stroke-width="2" stroke-linejoin="round"/>
        <rect x="18.5" y="19.5" width="27" height="6.5" rx="3.2" fill="#E7F3FD" stroke="#BADDF5" stroke-width="2"/>
        <path d="M16.5 32.5l1.5-9.5 9.5 5.5z" fill="#6FC0F0"/>
        <path d="M47.5 32.5l-1.5-9.5-9.5 5.5z" fill="#6FC0F0"/>
        <path d="M19 31l1-5.5 5.5 3.2z" fill="#C9E8FB"/>
        <path d="M45 31l-1-5.5-5.5 3.2z" fill="#C9E8FB"/>
        <ellipse cx="32" cy="41" rx="18" ry="14.5" fill="#A9DBF6"/>
        <ellipse cx="25.5" cy="39" rx="2.3" ry="2.9" fill="#4A3340"/>
        <ellipse cx="38.5" cy="39" rx="2.3" ry="2.9" fill="#4A3340"/>
        <ellipse cx="18.5" cy="44" rx="3.4" ry="2.3" fill="#FF5F92" opacity=".45"/>
        <ellipse cx="45.5" cy="44" rx="3.4" ry="2.3" fill="#FF5F92" opacity=".45"/>
        <path d="M30.2 44.5h3.6L32 46.8z" fill="#E2739A"/>
        <path d="M28 47.5q2 2.6 4 0 2 2.6 4 0" fill="none" stroke="#4A3340" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M11 39.5h6M11 44.5h6M47 39.5h6M47 44.5h6" stroke="#BADDF5" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>Middagsbanken</h1>
        <p><span class="count" id="stat">Hämtar middagsförslag …</span><span class="mode-note" id="mode-note">&nbsp;</span></p>
      </div>
    </div>
    <nav class="weeknav" aria-label="Veckoval">
      <button class="btn btn-icon" id="prev-week" title="Föregående vecka" aria-label="Föregående vecka">←</button>
      <span class="label"><span class="wk" id="wk-num">v.&nbsp;–</span><span class="span" id="wk-span">&nbsp;</span></span>
      <button class="btn btn-icon" id="next-week" title="Nästa vecka" aria-label="Nästa vecka">→</button>
      <button class="btn" id="this-week">Idag</button>
    </nav>
  </header>

  <div id="notice-slot"></div>

  <main class="layout">
    <section class="panel oron week" aria-labelledby="week-h">
      <div class="sec-head">
        <h2 id="week-h">Veckans matsedel</h2>
        <span class="hint" id="week-hint"></span>
      </div>
      <div class="week-tools">
        <button class="btn" id="fill-rest">Slumpa resten</button>
        <button class="btn" id="copy-last">Förra veckan</button>
        <button class="btn" id="share-week">Kopiera text</button>
        <button class="btn" id="clear-week">Rensa</button>
      </div>
      <ol class="days" id="days"></ol>
    </section>

    <section class="panel library" aria-labelledby="lib-h">
      <div class="sec-head">
        <h2 id="lib-h">Middagsförslag</h2>
        <button class="btn btn-primary" id="new-meal">＋ Nytt förslag</button>
      </div>
      <div class="toolbar">
        <div class="search">
          <svg class="lupp" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" style="color:var(--faint)">
            <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/>
          </svg>
          <input type="search" id="q" placeholder="Sök middag, ingrediens eller anteckning" aria-label="Sök bland middagsförslagen">
        </div>
        <select class="sel" id="sort" aria-label="Sortering">
          <option value="namn">Namn A–Ö</option>
          <option value="tid">Kortast tid</option>
          <option value="betyg">Högst betyg</option>
          <option value="ny">Senast tillagda</option>
        </select>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filter"></div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var DAGAR = ["Måndag","Tisdag","Onsdag","Torsdag","Fredag","Lördag","Söndag"];
  var state = {
    store: null, meals: null, plan: {}, weekStart: mondayOf(new Date()),
    armed: null, q: "", filter: "alla", sort: "namn", tags: []
  };
  var unsubPlan = null;

  /* ---------- små hjälpare ---------- */
  function $(id) { return document.getElementById(id); }
  function el(tag, attrs) {
    var n = document.createElement(tag), k;
    attrs = attrs || {};
    for (k in attrs) {
      var v = attrs[k];
      if (v === null || v === false || v === undefined) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (var i = 2; i < arguments.length; i++) {
      var kid = arguments[i];
      if (kid == null) continue;
      if (Array.isArray(kid)) kid.forEach(function (c) { if (c != null) n.append(c); });
      else n.append(kid);
    }
    return n;
  }
  var toastTimer;
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg; t.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("on"); }, 2600);
  }
  /** Gör om genererad SVG-markup till en nod. Markupen kommer från koden
   *  ovan, aldrig från något en användare skrivit. */
  function svgNod(markup) {
    var d = document.createElement("div");
    d.innerHTML = markup;
    return d.firstElementChild;
  }
  function ikonPlatta(m, storlek, liten) {
    return el("span", { class: "ikon-platta" + (liten ? " liten" : "") }, svgNod(matIkon(m, storlek)));
  }
  var TASS = "<svg class='tass' viewBox='0 0 24 24' aria-hidden='true'>"
    + "<ellipse cx='12' cy='16.5' rx='6.2' ry='5.2' fill='currentColor'/>"
    + "<circle cx='5.2' cy='9.5' r='2.7' fill='currentColor'/><circle cx='10' cy='6' r='2.7' fill='currentColor'/>"
    + "<circle cx='15.2' cy='6.4' r='2.7' fill='currentColor'/><circle cx='19.4' cy='10.4' r='2.5' fill='currentColor'/></svg>";

  /* ---------- betyg ---------- */
  function stjarna(fylld) {
    return "<svg class='stj' viewBox='0 0 24 24' aria-hidden='true'>"
      + "<path d='M12 3.6l2.55 5.5 5.95.78-4.35 4.15 1.1 5.92L12 17.05 6.75 19.95l1.1-5.92L3.5 9.88l5.95-.78z' fill='"
      + (fylld ? "currentColor" : "none") + "' stroke='currentColor' stroke-width='1.9' stroke-linejoin='round'/></svg>";
  }

  /**
   * Fem stjärnor. Klick på en stjärna sätter betyget, klick på samma
   * stjärna igen tar bort det. `vidVal` gör raden lokal — utan den sparas
   * betyget direkt till databasen.
   */
  function betygsrad(m, stor, vidVal) {
    var nu = m.betyg || 0;
    var rad = el("div", {
      class: "betyg" + (stor ? " stor" : ""), role: "group",
      "aria-label": "Betyg för " + m.namn + ": " + (nu ? nu + " av 5" : "inget betyg än")
    });
    for (var n = 1; n <= 5; n++) {
      (function (n) {
        var aktiv = nu >= n;
        rad.append(el("button", {
          type: "button", class: "stjarna" + (aktiv ? " pa" : ""),
          "aria-label": nu === n ? "Ta bort betyget" : "Sätt betyg " + n + " av 5",
          title: nu === n ? "Ta bort betyget" : "Sätt betyg " + n + " av 5",
          "aria-pressed": aktiv ? "true" : "false",
          onclick: function (e) {
            e.stopPropagation();
            var nytt = (nu === n) ? null : n;
            if (vidVal) vidVal(nytt); else sattBetyg(m, nytt);
          }
        }, svgNod(stjarna(aktiv))));
      })(n);
    }
    if (stor) rad.append(el("span", { class: "betyg-txt", text: nu ? nu + " av 5" : "" }));
    return rad;
  }

  function sattBetyg(m, n) {
    if (!state.store) return;
    state.store.setMeal(m.id, kropp(Object.assign({}, m, { betyg: n })))
      .then(function () { toast(n ? m.namn + ": " + n + " av 5" : "Betyget borttaget."); })
      .catch(function () { toast("Kunde inte spara betyget — är firestore.rules uppdaterad?"); });
  }

  function safeUrl(u) { return typeof u === "string" && /^https?:\/\//i.test(u.trim()) ? u.trim() : ""; }
  function fold(s) { return (s || "").toString().toLowerCase(); }
  function nyttId() { return "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function normalisera(id, v) {
    return {
      id: id, namn: v.namn || "(namnlös)", tid: typeof v.tid === "number" ? v.tid : null,
      veg: !!v.veg, lank: v.lank || "", anteckning: v.anteckning || "",
      kalla: v.kalla || "", taggar: Array.isArray(v.taggar) ? v.taggar : [],
      skapad: v.skapad || "", nr: v.nr || null,
      betyg: (typeof v.betyg === "number" && v.betyg >= 1 && v.betyg <= 5) ? Math.round(v.betyg) : null
    };
  }
  function kropp(m) {
    return { namn: m.namn, tid: m.tid, veg: m.veg, lank: m.lank, anteckning: m.anteckning,
             kalla: m.kalla, taggar: m.taggar, nr: m.nr, skapad: m.skapad,
             betyg: m.betyg === undefined ? null : m.betyg };
  }

  /* ---------- veckologik ---------- */
  function mondayOf(d) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
  function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function isoWeek(d) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    t.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7) + 3);
    var ft = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
    ft.setUTCDate(ft.getUTCDate() - ((ft.getUTCDay() + 6) % 7) + 3);
    return { ar: t.getUTCFullYear(), vecka: 1 + Math.round((t - ft) / 604800000) };
  }
  function keyOf(monday) { var w = isoWeek(monday); return w.ar + "-v" + String(w.vecka).padStart(2, "0"); }
  var fmtDay = new Intl.DateTimeFormat("sv-SE", { day: "numeric", month: "short" });

  /* ---------- kawaii-ikoner ---------- */
  /**
   * Varje middag får en egen liten ikon. Formen väljs på ord i rättens namn
   * (pasta, fisk, taco …) och resten — skålens färg, garneringen och
   * minspelet — kommer ur ett hashvärde av namnet. Två pastarätter blir
   * alltså igenkännbart pasta, men ser ändå olika ut.
   */
  var PASTELL = ["#9CC9F0", "#8FD6C7", "#FFD98A", "#B7C6F2", "#FFB3C7", "#FFBFA3"];
  var MORK = "#4A3340";

  function hashAv(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0);
  }
  function blanda(hex, mot, del) {
    function d(h, i) { return parseInt(h.substr(i, 2), 16); }
    var ut = "#";
    for (var i = 1; i < 7; i += 2) {
      var v = Math.round(d(hex, i) + (d(mot, i) - d(hex, i)) * del);
      ut += ("0" + v.toString(16)).slice(-2);
    }
    return ut;
  }
  function ljus(c, d) { return blanda(c, "#ffffff", d === undefined ? 0.4 : d); }
  function mork(c, d) { return blanda(c, "#7A4B5E", d === undefined ? 0.25 : d); }

  /** Ögon, kindrodnad och mun — det som gör formen söt. */
  function ansikte(x, y, v, litet) {
    var s = litet ? 0.72 : 1;
    var mun = v === 0 ? "M" + (x - 2.8 * s) + " " + y + "q" + (2.8 * s) + " " + (2.8 * s) + " " + (5.6 * s) + " 0"
            : v === 1 ? "M" + (x - 3 * s) + " " + y + "q" + (1.5 * s) + " " + (1.9 * s) + " " + (3 * s) + " 0q" + (1.5 * s) + " " + (1.9 * s) + " " + (3 * s) + " 0"
            :           "M" + (x - 2 * s) + " " + y + "q" + (2 * s) + " " + (1.7 * s) + " " + (4 * s) + " 0";
    return "<ellipse cx='" + (x - 4.8 * s) + "' cy='" + (y - 3.6 * s) + "' rx='" + (1.5 * s) + "' ry='" + (1.95 * s) + "' fill='" + MORK + "'/>"
         + "<ellipse cx='" + (x + 4.8 * s) + "' cy='" + (y - 3.6 * s) + "' rx='" + (1.5 * s) + "' ry='" + (1.95 * s) + "' fill='" + MORK + "'/>"
         + "<ellipse cx='" + (x - 8.4 * s) + "' cy='" + (y - 0.4 * s) + "' rx='" + (2.2 * s) + "' ry='" + (1.45 * s) + "' fill='#FF7FA8' opacity='.5'/>"
         + "<ellipse cx='" + (x + 8.4 * s) + "' cy='" + (y - 0.4 * s) + "' rx='" + (2.2 * s) + "' ry='" + (1.45 * s) + "' fill='#FF7FA8' opacity='.5'/>"
         + "<path d='" + mun + "' fill='none' stroke='" + MORK + "' stroke-width='" + (1.35 * s) + "' stroke-linecap='round'/>";
  }

  /** Behållare som många rätter delar. */
  function skal(c, innehall) {
    return innehall
      + "<path d='M7 27h34a17 15 0 0 1-34 0z' fill='" + c + "'/>"
      + "<ellipse cx='24' cy='27' rx='17' ry='3' fill='" + ljus(c, 0.45) + "'/>";
  }
  function tallrik(c, innehall) {
    return "<ellipse cx='24' cy='32' rx='19' ry='7' fill='" + ljus(c, 0.55) + "'/>"
      + "<ellipse cx='24' cy='31' rx='13.5' ry='4.4' fill='" + c + "'/>"
      + innehall;
  }

  var FORMER = {
    pasta: function (c, f) {
      return skal(c, "<ellipse cx='24' cy='22' rx='13.5' ry='8.5' fill='#FFE7A3'/>"
        + "<path d='M12.5 20.5q3.5-3 7 0t7 0 7 0M12.5 24q3.5-3 7 0t7 0 7 0' fill='none' stroke='#EBC069' stroke-width='1.5' stroke-linecap='round'/>"
        + "<circle cx='31' cy='17.5' r='3.2' fill='#EE7E8E'/>" + ansikte(22, 22, f));
    },
    pizza: function (c, f) {
      return "<path d='M24 7 42 37H6z' fill='#FFD27E' stroke='#E9A94A' stroke-width='2' stroke-linejoin='round'/>"
        + "<path d='M7.5 36h33' stroke='#DFA055' stroke-width='5' stroke-linecap='round'/>"
        + "<circle cx='17' cy='28' r='2.8' fill='#EE7E8E'/><circle cx='31' cy='28' r='2.8' fill='#EE7E8E'/>"
        + "<circle cx='24' cy='19' r='2.4' fill='#EE7E8E'/>" + ansikte(24, 25, f, true);
    },
    soppa: function (c, f) {
      return skal(c, "<ellipse cx='24' cy='24' rx='14.5' ry='6.5' fill='" + ljus("#F5A45E", 0.1) + "'/>"
        + "<path d='M17 12q3-3 0-6M24 11q3-3 0-6M31 12q3-3 0-6' fill='none' stroke='" + ljus(c, 0.5) + "' stroke-width='1.8' stroke-linecap='round'/>"
        + ansikte(24, 23, f, true));
    },
    gryta: function (c, f) {
      return "<rect x='9' y='19' width='30' height='18' rx='6' fill='" + c + "'/>"
        + "<rect x='6' y='15' width='36' height='5' rx='2.5' fill='" + ljus(c, 0.4) + "'/>"
        + "<rect x='22' y='10' width='4' height='5' rx='2' fill='" + mork(c) + "'/>"
        + "<rect x='3' y='23' width='5' height='4' rx='2' fill='" + mork(c) + "'/><rect x='40' y='23' width='5' height='4' rx='2' fill='" + mork(c) + "'/>"
        + ansikte(24, 28, f);
    },
    fisk: function (c, f, extra) {
      return "<path d='M34 24 44 17v14z' fill='" + mork(c, 0.15) + "'/>"
        + "<ellipse cx='21' cy='24' rx='15' ry='9.5' fill='" + c + "'/>"
        + "<path d='M17 14.5q4-4.5 8 0' fill='none' stroke='" + mork(c, 0.15) + "' stroke-width='2' stroke-linecap='round'/>"
        + (extra || "") + ansikte(18, 25, f, true);
    },
    lax: function (c, f) {
      return FORMER.fisk("#FFAE94", f, "<path d='M10 27q6 2.5 12 0' fill='none' stroke='#FFF0E6' stroke-width='2' stroke-linecap='round'/>");
    },
    taco: function (c, f) {
      return "<path d='M9 31a15 15 0 0 1 30 0z' fill='#8FD6A0'/>"
        + "<circle cx='16' cy='26' r='2.4' fill='#EE7E8E'/><circle cx='32' cy='26' r='2.4' fill='#EE7E8E'/>"
        + "<path d='M6 33a18 18 0 0 1 36 0 4 4 0 0 1-4 3H10a4 4 0 0 1-4-3z' fill='#FFD27E' stroke='#E9B05C' stroke-width='1.6'/>"
        + ansikte(24, 31, f, true);
    },
    burgare: function (c, f) {
      return "<path d='M8 23a16 13 0 0 1 32 0z' fill='#F0BE79'/>"
        + "<circle cx='18' cy='16' r='1.1' fill='#FFF3DC'/><circle cx='26' cy='14' r='1.1' fill='#FFF3DC'/><circle cx='32' cy='18' r='1.1' fill='#FFF3DC'/>"
        + "<path d='M7 23q4 3.5 8 0t8 0 8 0 8 0v2H7z' fill='#8FD6A0'/>"
        + "<rect x='8' y='26' width='32' height='6.5' rx='3.2' fill='#B5714A'/>"
        + "<path d='M9 33h30a6 6 0 0 1-6 5H15a6 6 0 0 1-6-5z' fill='#F0BE79'/>"

    },
    pannkaka: function (c, f) {
      return "<ellipse cx='24' cy='33' rx='16' ry='5' fill='#EFC27B'/>"
        + "<ellipse cx='24' cy='28' rx='16' ry='5' fill='#F7CF8A'/>"
        + "<ellipse cx='24' cy='23' rx='16' ry='5.4' fill='#FFDCA0'/>"
        + "<path d='M13 21q5 4 11 2t11 1' fill='none' stroke='#E8A55C' stroke-width='1.6' stroke-linecap='round'/>"

    },
    vaffla: function (c, f) {
      return "<path d='M24 38C10 29 6 23 6 17.5A8.5 8.5 0 0 1 24 13a8.5 8.5 0 0 1 18 4.5C42 23 38 29 24 38z' fill='#F7CF8A' stroke='#E0A24A' stroke-width='1.6'/>"

    },
    ris: function (c, f) {
      return skal(c, "<ellipse cx='24' cy='21' rx='13' ry='8.5' fill='#FFF7EC'/>"

        + "<circle cx='31' cy='22' r='3' fill='#8FD6A0'/>" + ansikte(22, 21, f, true));
    },

    },

    },
    agg: function (c, f) {
      return "<path d='M12 33c-7 0-9-6-6-10s1-9 6-10 8 3 12 2 11-1 12 6-3 7-4 10-13 2-20 2z' fill='#FFF9F0' stroke='#F0E2D2' stroke-width='1.4'/>"
        + "<circle cx='24' cy='23' r='8' fill='#FFC94D'/>" + ansikte(24, 24, f, true);
    },
    paj: function (c, f) {
      return "<path d='M24 10 43 36H5z' fill='#F7CF8A' stroke='#DFA055' stroke-width='1.8' stroke-linejoin='round'/>"
        + "<path d='M15 27l14-8M19 33l16-9' stroke='#E0A24A' stroke-width='1.8' stroke-linecap='round'/>"
        + "<path d='M6 36h36' stroke='#DFA055' stroke-width='4.5' stroke-linecap='round'/>"
        + ansikte(24, 25, f, true);
    },
    macka: function (c, f) {
      return "<path d='M6 32 24 12l18 20z' fill='#F7CF8A' stroke='#DFA055' stroke-width='1.6' stroke-linejoin='round'/>"
        + "<path d='M11 27h26' stroke='#8FD6A0' stroke-width='2.6' stroke-linecap='round'/>"
        + "<path d='M9 31h30' stroke='#E58A7B' stroke-width='2.6' stroke-linecap='round'/>"
        + "<path d='M6 32h36' stroke='#DFA055' stroke-width='4' stroke-linecap='round'/>"
        + ansikte(24, 23, f, true);
    },
    sallad: function (c, f) {
      return skal(c, "<ellipse cx='24' cy='22' rx='13.5' ry='8.5' fill='#8FD6A0'/>"
        + "<path d='M13 21q4-5 8 0M23 19q4-5 8 0' fill='none' stroke='#6BBE80' stroke-width='1.8' stroke-linecap='round'/>"
        + "<circle cx='31' cy='22' r='3' fill='#EE7E8E'/><circle cx='16' cy='24' r='2.2' fill='#FFC94D'/>"
        + ansikte(23, 23, f, true));

  /* Ord i rättens namn → form. Ordningen avgör: det första som träffar vinner. */
  var IKONORD = [
    ["pasta", ["pasta", "spagetti", "spaghetti", "carbonara", "tortellini", "makaron", "aglio"]],

    ["gratang", ["gratäng", "lasagne", "moussaka"]],

    ["wrap", ["quesadilla", "wrap", "burrito", "tortilla"]],

    ["gryta", ["gryta", "curry", "stroganoff", "chili", "stuvning", "aloo"]]
  ];

  function formFor(namn) {
    var n = fold(namn);
    for (var i = 0; i < IKONORD.length; i++) {
      var ord = IKONORD[i][1];
      for (var j = 0; j < ord.length; j++) if (n.indexOf(ord[j]) !== -1) return IKONORD[i][0];
    }
    return "tallriken";
  }

  /** Liten garnering uppe i hörnet, så att två rätter med samma form skiljs åt. */
  function garnering(sort, c) {
    if (sort === 0) return "";
    if (sort === 1) return "<path d='M40 9q4-1 5 3-4 2-5-3z' fill='#8FD6A0'/>";
    if (sort === 2) return "<path d='M41 13a2.4 2.4 0 1 1 3.4-3.4A2.4 2.4 0 1 1 41 13z' fill='" + c + "'/>";
    return "<path d='M42 7l1.1 2.6 2.6 1.1-2.6 1.1L42 14.4l-1.1-2.6-2.6-1.1 2.6-1.1z' fill='#FFCF5C'/>";
  }

  /** Returnerar en färdig <svg> för en middag. Namnet används bara till hash. */
  function matIkon(m, storlek) {
    var h = hashAv(m.namn || "");
    var karl = PASTELL[h % PASTELL.length];
    var min = (h >> 3) % 3;
    var garn = (h >> 6) % 4;
    var form = formFor(m.namn || "");
    var inre = (FORMER[form] || FORMER.tallriken)(karl, min);
    return "<svg class='mat-ikon' viewBox='0 0 48 48' width='" + storlek + "' height='" + storlek
      + "' role='img' aria-hidden='true' focusable='false'>" + inre + garnering(garn, m.veg ? "#8FD6A0" : "#FF9DB8") + "</svg>";
  }

  /* ---------- lagring: Firebase Firestore ---------- */
  /**
   * En delad databas för alla som använder sidan. Firestore skickar
   * ändringar vidare till alla öppna sidor direkt, så det behövs ingen
   * pollning: det någon annan gör dyker upp med en gång.
   *
   * Nyckeln i data/config.json är avsedd att vara publik — den pekar bara
   * ut projektet. Vad som faktiskt får läsas och skrivas bestäms av
   * reglerna i firestore.rules.
   */
  var SDK = "https://www.gstatic.com/firebasejs/12.4.0/";

  function startaFirestore(cfg) {
    return Promise.all([
      import(SDK + "firebase-app.js"),
      import(SDK + "firebase-firestore.js")
    ]).then(function (moduler) {
      var app = moduler[0], F = moduler[1];
      var db = F.getFirestore(app.initializeApp(cfg));

      // ?emulator=host:port kopplar mot en lokal Firestore vid test
      var emu = new URLSearchParams(location.search).get("emulator");
      if (emu) {
        var delar = emu.split(":");
        F.connectFirestoreEmulator(db, delar[0], parseInt(delar[1], 10));
      }
      return firestoreStore(F, db);
    });
  }

  function firestoreStore(F, db) {
    var meals = [], weeks = {}, harMiddagar = false;
    var mealCb = null, planCb = null, planKey = null, tappad = false;

    function sand() {
      if (!harMiddagar) return;
      if (mealCb) mealCb(meals.map(function (m) { return normalisera(m.id, m); }));
      if (planCb && planKey) planCb(Object.assign({}, weeks[planKey] || {}));
    }

    function tappadeKontakten() {
      if (tappad) return;
      tappad = true;
      toast("Tappade kontakten med databasen. Ladda om sidan.");
    }

    F.onSnapshot(F.collection(db, "middagar"), function (snap) {
      meals = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      harMiddagar = true;
      sand();
    }, tappadeKontakten);

    F.onSnapshot(F.collection(db, "veckor"), function (snap) {
      weeks = {};
      snap.docs.forEach(function (d) {
        var v = d.data() || {};
        weeks[d.id] = (v.dagar && typeof v.dagar === "object") ? v.dagar : {};
      });
      sand();
    }, tappadeKontakten);

    return {
      onMeals: function (cb) { mealCb = cb; sand(); return function () { mealCb = null; }; },
      onPlan: function (key, cb) {
        planCb = cb; planKey = key;
        cb(Object.assign({}, weeks[key] || {}));
        return function () { planCb = null; planKey = null; };
      },
      getPlan: function (key) { return Promise.resolve(Object.assign({}, weeks[key] || {})); },
      savePlan: function (key, dagar) {
        var ref = F.doc(db, "veckor", key);
        if (!Object.keys(dagar).length) return F.deleteDoc(ref);
        return F.setDoc(ref, { vecka: key, dagar: dagar, uppdaterad: new Date().toISOString() });
      },
      addMeal: function (body) {
        return F.addDoc(F.collection(db, "middagar"), body).then(function (ref) { return ref.id; });
      },
      setMeal: function (id, body) { return F.setDoc(F.doc(db, "middagar", id), body); },
      delMeal: function (id) { return F.deleteDoc(F.doc(db, "middagar", id)); }
    };
  }

  /* ---------- plan ---------- */
  function mealById(id) {
    if (!id || !state.meals) return null;
    for (var i = 0; i < state.meals.length; i++) if (state.meals[i].id === id) return state.meals[i];
    return null;
  }
  function savePlan(dagar) {
    if (!state.store) { toast("Middagslistan är inte laddad än."); return Promise.resolve(); }
    state.plan = dagar;
    renderWeek(); renderCards();
    return state.store.savePlan(keyOf(state.weekStart), dagar)
      .catch(function () { toast("Kunde inte spara veckan – försök igen."); });
  }
  function setDay(i, mealId) {
    var d = Object.assign({}, state.plan);
    if (mealId) d[String(i)] = mealId; else delete d[String(i)];
    return savePlan(d);
  }
  function watchPlan() {
    if (unsubPlan) { unsubPlan(); unsubPlan = null; }
    if (!state.store) return;
    unsubPlan = state.store.onPlan(keyOf(state.weekStart), function (dagar) {
      state.plan = dagar; renderWeek(); renderCards();
    }, function () { toast("Tappade kontakten med veckoplanen. Ladda om sidan."); });
  }

  var FILTER = [

        )
      );
      card.addEventListener("click", function () { if (state.armed !== null) place(m); });
      box.append(card);
    });
  }

  function place(m) {
    if (state.armed !== null) {
      var i = state.armed;
      armDay(null);
      setDay(i, m.id);
      toast(m.namn + " → " + DAGAR[i].toLowerCase());
    } else {
      openDayPicker(m);
    }
  }

  function renderStats() {
    if (!state.meals) return;
    var veg = state.meals.filter(function (m) { return m.veg; }).length;
    var rec = state.meals.filter(function (m) { return safeUrl(m.lank); }).length;
    var bet = state.meals.filter(function (m) { return m.betyg; }).length;
    $("stat").textContent = state.meals.length + " förslag · " + veg + " vegetariska · " + rec + " med recept"
      + (bet ? " · " + bet + " betygsatta" : "");
  }

  /* ---------- dagväljare ---------- */
  var dayDlg = $("day-dialog");
  function openDayPicker(m) {
    $("day-dlg-title").textContent = "Vilken dag?";
    $("day-dlg-sub").textContent = m.namn;
    var ikon = $("day-dlg-ikon");
    ikon.textContent = "";
    ikon.append(svgNod(matIkon(m, 34)));
    var box = $("daypick"); box.textContent = "";
    for (var i = 0; i < 7; i++) {
      (function (i) {
        var taken = mealById(state.plan[String(i)]);
        box.append(el("button", {
          type: "button",
          onclick: function () { dayDlg.close(); setDay(i, m.id); toast(m.namn + " → " + DAGAR[i].toLowerCase()); }
        },
          el("span", {}, DAGAR[i] + " " + fmtDay.format(addDays(state.weekStart, i))),
          el("span", { class: "taken", text: taken ? "ersätter " + taken.namn : (state.plan[String(i)] ? "ersätter tidigare val" : "tom") })
        ));
      })(i);
    }
    dayDlg.showModal();
  }
  $("day-cancel").addEventListener("click", function () { dayDlg.close(); });

  /* ---------- formulär ---------- */
  var mealDlg = $("meal-dialog"), editing = null, formBetyg = null;
  function ritaFormBetyg() {
    var ruta = $("f-betyg");
    ruta.textContent = "";
    ruta.append(betygsrad({ namn: $("f-namn").value || "middagen", betyg: formBetyg }, true, function (n) {
      formBetyg = n; ritaFormBetyg();
    }));
  }
  function openMealForm(m) {
    editing = m || null;
    $("meal-dlg-title").textContent = m ? "Redigera middag" : "Nytt middagsförslag";
    $("f-namn").value = m ? m.namn : "";
    $("f-tid").value = m && m.tid ? m.tid : "";
    $("f-veg").checked = !!(m && m.veg);
    $("f-lank").value = m ? (m.lank || "") : "";
    $("f-ant").value = m ? (m.anteckning || "") : "";
    formBetyg = m ? (m.betyg || null) : null;
    ritaFormBetyg();
    $("f-err").hidden = true;
    $("f-delete").hidden = !m;
    mealDlg.showModal();
    $("f-namn").focus();
  }
  $("new-meal").addEventListener("click", function () { openMealForm(null); });
  $("f-cancel").addEventListener("click", function () { mealDlg.close(); });

  $("meal-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var namn = $("f-namn").value.trim();
    if (!namn) { $("f-err").hidden = false; $("f-namn").focus(); return; }
    if (!state.store) { toast("Middagslistan är inte laddad än."); return; }

    var tid = parseInt($("f-tid").value, 10);
    var body = {
      namn: namn,
      tid: isFinite(tid) && tid > 0 ? tid : null,
      veg: $("f-veg").checked,
      lank: $("f-lank").value.trim(),
      anteckning: $("f-ant").value.trim(),
      kalla: editing ? (editing.kalla || "Tillagd i appen") : "Tillagd i appen",
      taggar: editing ? (editing.taggar || []) : ["Eget tillägg"],
      nr: editing ? (editing.nr || null) : null,
      skapad: editing ? (editing.skapad || new Date().toISOString()) : new Date().toISOString(),
      betyg: formBetyg
    };
    var var_editing = editing;
    mealDlg.close();
    var p = var_editing ? state.store.setMeal(var_editing.id, body) : state.store.addMeal(body);
    p.then(function () { toast(var_editing ? "Ändringen sparad." : namn + " tillagd."); })
      .catch(function () { toast("Kunde inte spara middagen – försök igen."); });
    editing = null;
  });

  $("f-delete").addEventListener("click", function () {
    if (!editing || !state.store) return;
    var m = editing;
    if (!window.confirm("Ta bort ”" + m.namn + "” ur listan?")) return;
    mealDlg.close(); editing = null;
    for (var i = 0; i < 7; i++) if (state.plan[String(i)] === m.id) setDay(i, null);
    state.store.delMeal(m.id)
      .then(function () { toast(m.namn + " borttagen."); })
      .catch(function () { toast("Kunde inte ta bort middagen."); });
  });

  /* ---------- veckoknappar ---------- */
  function gotoWeek(monday) { state.weekStart = monday; armDay(null); watchPlan(); renderWeek(); }
  $("prev-week").addEventListener("click", function () { gotoWeek(addDays(state.weekStart, -7)); });
  $("next-week").addEventListener("click", function () { gotoWeek(addDays(state.weekStart, 7)); });
  $("this-week").addEventListener("click", function () { gotoWeek(mondayOf(new Date())); });
  $("arm-cancel").addEventListener("click", function () { armDay(null); });

  $("clear-week").addEventListener("click", function () {
    if (!window.confirm("Rensa hela veckan?")) return;
    savePlan({});
  });

  $("fill-rest").addEventListener("click", function () {
    if (!state.meals || !state.meals.length) return;
    var used = {}, i;
    for (i = 0; i < 7; i++) if (state.plan[String(i)]) used[state.plan[String(i)]] = true;
    var pool = state.meals.filter(function (m) { return !used[m.id]; });
    var next = Object.assign({}, state.plan), lagt = 0;
    for (i = 0; i < 7; i++) {
      if (next[String(i)] || !pool.length) continue;
      next[String(i)] = pool.splice(Math.floor(Math.random() * pool.length), 1)[0].id;
      lagt++;
    }
    if (!lagt) { toast("Det finns inga fler middagar att fylla på med."); return; }
    savePlan(next);
    toast(lagt + (lagt === 1 ? " dag fylld." : " dagar fyllda."));
  });

  $("copy-last").addEventListener("click", function () {
    if (!state.store) return;
    var prev = addDays(state.weekStart, -7);
    state.store.getPlan(keyOf(prev)).then(function (d) {
      if (!d || !Object.keys(d).length) { toast("Förra veckan är tom."); return; }
      savePlan(Object.assign({}, d));
      toast("Hämtade matsedeln från v. " + isoWeek(prev).vecka + ".");
    }).catch(function () { toast("Kunde inte hämta förra veckan."); });
  });

  /* ---------- veckan som text ---------- */
  function veckanSomText() {
    var w = isoWeek(state.weekStart);
    var rader = ["Veckomatsedel v. " + w.vecka + " (" + fmtDay.format(state.weekStart) + "–" + fmtDay.format(addDays(state.weekStart, 6)) + ")", ""];
    for (var i = 0; i < 7; i++) {
      var m = mealById(state.plan[String(i)]);
      rader.push(DAGAR[i] + ": " + (m ? m.namn + (m.tid ? " (" + m.tid + " min)" : "") : "—"));
    }
    return rader.join("\n");
  }

  $("share-week").addEventListener("click", function () {
    var text = veckanSomText();
    var visa = function () { $("text-out").value = text; $("text-dialog").showModal(); $("text-out").select(); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { toast("Matsedeln kopierad."); }, visa);
      } else { visa(); }
    } catch (e) { visa(); }
  });
  $("text-close").addEventListener("click", function () { $("text-dialog").close(); });

  /* ---------- sök och tangenter ---------- */
  $("q").addEventListener("input", function (e) { state.q = e.target.value; renderCards(); });
  $("sort").addEventListener("change", function (e) { state.sort = e.target.value; renderCards(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && state.armed !== null) armDay(null); });

  /* ---------- start ---------- */
  renderChips();
  renderWeek();
  renderCards();

  function anvand(store) {
    state.store = store;
    $("mode-note").textContent = "Delad databas – alla som öppnar sidan ser och ändrar samma matsedel";
    store.onMeals(function (meals) {
      state.meals = meals;
      var tags = [];
      meals.forEach(function (m) { m.taggar.forEach(function (t) { if (t !== "Matplanering" && tags.indexOf(t) === -1) tags.push(t); }); });
      state.tags = tags.sort(function (a, b) { return a.localeCompare(b, "sv"); });
      renderStats(); renderChips(); renderCards(); renderWeek();
    });
    watchPlan();
  }

  function ingenData(msg) {
    state.meals = [];
    $("notice-slot").textContent = "";
    $("notice-slot").append(el("div", { class: "notice", text: msg }));
    $("stat").textContent = "Databasen är inte tillgänglig";
    $("mode-note").textContent = " ";
    renderCards(); renderWeek();
  }

  fetch("data/config.json", { cache: "no-cache" })
    .then(function (r) { return r.ok ? r.json() : {}; })
    .then(function (cfg) {
      var fb = cfg && cfg.firebase;
      if (!fb || !fb.projectId) {
        ingenData("Databasen är inte inkopplad än. Följ anvisningen i README.md och lägg projektets uppgifter i data/config.json.");
        return null;
      }
      return startaFirestore(fb).then(anvand);
    })
    .catch(function () {
      ingenData("Når inte databasen. Kontrollera uppgifterna i data/config.json och ladda om sidan.");
    });
})();
</script>
