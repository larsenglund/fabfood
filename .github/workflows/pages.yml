name: Publicera till GitHub Pages

on:
  push:
    branches: [claude/weekly-meal-planner-kysdq8]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicera:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Ställ i ordning det som ska publiceras
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/data
          touch _site/.nojekyll

      - name: Slå på Pages om det behövs
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
